<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">BLOCK-20 protocol documentation</title>
  <desc id="d">Dark slate card reading BLOCK-20, an inscription-carried token protocol on Bitcoin whose mints are anchored to a block, with a row of chained blocks below and one highlighted in amber as the anchor.</desc>
  <rect width="1200" height="630" fill="#0e1218"/>
  <g fill="none" stroke="#f2a938" stroke-width="4">
    <rect x="72" y="72" width="52" height="52" rx="6"/>
  </g>
  <text x="86" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#f2a938">B20</text>
  <text x="146" y="109" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e6eaf0" letter-spacing="1">BLOCK-20</text>
  <text x="72" y="228" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#e6eaf0">An inscription token protocol</text>
  <text x="72" y="304" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f2a938">whose mints are anchored</text>
  <text x="72" y="380" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#e6eaf0">to a Bitcoin block.</text>
  <g stroke="#46525f" stroke-width="3" fill="none">
    <path d="M232 494 h36"/><path d="M428 494 h36"/><path d="M624 494 h36"/>
  </g>
  <g>
    <rect x="72" y="454" width="160" height="80" rx="6" fill="#151b23" stroke="#46525f" stroke-width="3"/>
    <text x="94" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#a3adbb">deploy</text>
  </g>
  <g>
    <rect x="268" y="454" width="160" height="80" rx="6" fill="#2a1e0c" stroke="#f2a938" stroke-width="4"/>
    <text x="290" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#f2a938">anchor</text>
  </g>
  <g>
    <rect x="464" y="454" width="160" height="80" rx="6" fill="#151b23" stroke="#46525f" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="524" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#a3adbb">. . .</text>
  </g>
  <g>
    <rect x="660" y="454" width="160" height="80" rx="6" fill="#151b23" stroke="#46525f" stroke-width="3"/>
    <text x="682" y="502" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#a3adbb">reveal</text>
  </g>
  <text x="860" y="490" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f2a938">D &#8804; A &lt; R</text>
  <text x="860" y="524" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#f2a938">R - A &#8804; 144</text>
  <text x="72" y="586" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" fill="#a3adbb">bitcoinuniverseio.github.io/block-20</text>
</svg>
